"""حاسبة استهلاك الخيط والقماش - نسخة سطح المكتب (Windows / macOS)."""
import base64
import json
import mimetypes
import os
import threading
import tkinter as tk
from pathlib import Path
from tkinter import filedialog, messagebox, ttk

MODEL = "claude-sonnet-5-5"
CONFIG = Path.home() / ".consumption_calc.json"

FABRICS = {
    "جيرسي قطن (تريكو)": (180, 1.00),
    "بيكيه": (210, 1.05),
    "فليس / ميلتون": (280, 1.20),
    "ريب / لاكوست": (200, 1.05),
    "بوبلين / قماش خفيف منسوج": (120, 0.90),
    "تويل / جبردين": (220, 1.10),
    "دنيم": (340, 1.30),
    "ساتان / حرير": (100, 0.85),
    "ليكرا / سبندكس": (220, 1.10),
}
RATIOS = {"301": 3.0, "401": 4.5, "504": 13.0, "514": 15.5,
          "516": 20.0, "602": 22.0, "605": 25.0, "406": 9.0}

PROMPT = """أنت مهندس إنتاج ملابس. اقرأ الـ spec المرفق واستخرج بيانات حساب الاستهلاك.
القماش: {fabric}. أرجع JSON فقط بدون أي نص آخر بالشكل:
{{"style":"اسم الاستايل","notes":"ملاحظات قصيرة بالعربي","estimated":true,
"pieces":[{{"name":"","w":0,"h":0,"q":1}}],
"seams":[{{"name":"","stitch":"514","len":0,"q":1}}]}}
القواعد: كل الأبعاد بالسنتيمتر للمقاس الأساسي (الأوسط) لقطعة واحدة.
pieces هي مستطيل محيط بكل قطعة باترون (زيادة الخياطة داخلة) وq عدد القطع في الاستايل الواحد.
seams هي أطوال الدروز الفعلية بنوع الغرزة المذكور في الـ spec (من: 301 401 504 514 516 602 605 406)،
ولو مش مذكور اختار الأنسب لنوع القماش.
لو الـ spec مفيهوش أبعاد باترون، قدّرها من جدول القياسات واجعل estimated=true واذكر ده في notes."""


def calculate(pieces, seams, width, eff, fabric_waste, thread_waste,
              qty, gsm, thread_factor, ratios=RATIOS):
    """يرجع (قماش م، قماش كجم، خيط م) للقطعة الواحدة."""
    area = sum(p["w"] * p["h"] * p["q"] for p in pieces)
    eff = eff / 100 or 1
    fab_m = area / eff * (1 + fabric_waste / 100) / width / 100 if width else 0
    fab_kg = fab_m * (width / 100) * gsm / 1000
    thread_cm = sum(s["len"] * s["q"] * ratios.get(s["stitch"], 0) for s in seams)
    thread_m = thread_cm * thread_factor * (1 + thread_waste / 100) / 100
    return fab_m, fab_kg, thread_m


def read_spec(api_key, files, fabric):
    import anthropic
    content = []
    for f in files:
        data = base64.standard_b64encode(Path(f).read_bytes()).decode()
        if f.lower().endswith(".pdf"):
            content.append({"type": "document", "source": {
                "type": "base64", "media_type": "application/pdf", "data": data}})
        else:
            mt = mimetypes.guess_type(f)[0] or "image/jpeg"
            content.append({"type": "image", "source": {
                "type": "base64", "media_type": mt, "data": data}})
    content.append({"type": "text", "text": PROMPT.format(fabric=fabric)})
    client = anthropic.Anthropic(api_key=api_key)
    msg = client.messages.create(model=MODEL, max_tokens=4000,
                                 messages=[{"role": "user", "content": content}])
    text = "".join(b.text for b in msg.content if b.type == "text")
    return json.loads(text[text.index("{"): text.rindex("}") + 1])


class App(tk.Tk):
    def __init__(self):
        super().__init__()
        self.title("حاسبة استهلاك الخيط والقماش")
        self.geometry("920x800")
        self.files = []
        self.ratios = dict(RATIOS)
        self.vars = {}
        self._build()
        self.calc()

    # ---------- واجهة ----------
    def _build(self):
        top = ttk.LabelFrame(self, text="١) القماش والطلبية")
        top.pack(fill="x", padx=10, pady=6)
        self.fabric = tk.StringVar(value=list(FABRICS)[0])
        cb = ttk.Combobox(top, textvariable=self.fabric, values=list(FABRICS), state="readonly", width=24)
        cb.grid(row=0, column=1, padx=4, pady=4)
        ttk.Label(top, text="نوع القماش").grid(row=0, column=0)
        cb.bind("<<ComboboxSelected>>", self._fabric_changed)
        fields = [("width", "عرض القماش سم", 150), ("gsm", "الوزن GSM", 180),
                  ("eff", "كفاءة الماركر %", 82), ("fw", "هالك قماش %", 3),
                  ("tw", "هالك خيط %", 5), ("qty", "كمية الطلبية", 1000)]
        for i, (k, label, d) in enumerate(fields):
            r, c = divmod(i, 3)
            ttk.Label(top, text=label).grid(row=r + 1, column=c * 2, padx=4, pady=2)
            v = tk.StringVar(value=str(d))
            v.trace_add("write", lambda *a: self.calc())
            self.vars[k] = v
            ttk.Entry(top, textvariable=v, width=10).grid(row=r + 1, column=c * 2 + 1)

        sp = ttk.LabelFrame(self, text="٢) الـ Spec (صور أو PDF)")
        sp.pack(fill="x", padx=10, pady=6)
        ttk.Button(sp, text="اختار ملفات", command=self.pick).pack(side="left", padx=4, pady=4)
        self.go = ttk.Button(sp, text="اقرأ الـ Spec", command=self.run_ai)
        self.go.pack(side="left", padx=4)
        ttk.Button(sp, text="مفتاح API", command=self.ask_key).pack(side="left", padx=4)
        self.status = ttk.Label(sp, text="لسه مفيش ملفات")
        self.status.pack(side="left", padx=8)
        self.notes = ttk.Label(self, text="", wraplength=880, foreground="#667085")
        self.notes.pack(fill="x", padx=12)

        self.pt = self._table("٣) قطع القماش (سم) - دبل كليك للتعديل",
                              ("name", "w", "h", "q"), ("القطعة", "العرض", "الطول", "العدد"), 5)
        self.st = self._table("٤) الدروز (سم) - دبل كليك للتعديل",
                              ("name", "stitch", "len", "q"), ("الدرزة", "الغرزة", "الطول", "العدد"), 7)

        res = ttk.LabelFrame(self, text="النتيجة")
        res.pack(fill="x", padx=10, pady=6)
        self.out = tk.StringVar()
        ttk.Label(res, textvariable=self.out, font=("Arial", 12), justify="right").pack(padx=8, pady=6)
        ttk.Button(res, text="معاملات الغرز", command=self.edit_ratios).pack(pady=2)

    def _table(self, title, cols, heads, height):
        fr = ttk.LabelFrame(self, text=title)
        fr.pack(fill="both", expand=True, padx=10, pady=4)
        tv = ttk.Treeview(fr, columns=cols, show="headings", height=height)
        for c, h in zip(cols, heads):
            tv.heading(c, text=h)
            tv.column(c, width=120, anchor="center")
        tv.pack(side="left", fill="both", expand=True)
        bar = ttk.Frame(fr)
        bar.pack(side="right", fill="y")
        ttk.Button(bar, text="+ إضافة", command=lambda: self.add_row(tv)).pack(pady=2)
        ttk.Button(bar, text="× حذف", command=lambda: self.del_row(tv)).pack(pady=2)
        tv.bind("<Double-1>", lambda e: self.edit_cell(tv, e))
        return tv

    # ---------- جداول ----------
    def add_row(self, tv):
        tv.insert("", "end", values=("قطعة", 0, 0, 1) if tv is self.pt else ("درزة", "514", 0, 1))
        self.calc()

    def del_row(self, tv):
        for i in tv.selection():
            tv.delete(i)
        self.calc()

    def edit_cell(self, tv, event):
        item, col = tv.identify_row(event.y), tv.identify_column(event.x)
        if not item:
            return
        idx = int(col[1:]) - 1
        x, y, w, h = tv.bbox(item, col)
        e = ttk.Entry(tv)
        e.insert(0, tv.item(item, "values")[idx])
        e.place(x=x, y=y, width=w, height=h)
        e.focus()

        def done(_=None):
            vals = list(tv.item(item, "values"))
            vals[idx] = e.get()
            tv.item(item, values=vals)
            e.destroy()
            self.calc()
        e.bind("<Return>", done)
        e.bind("<FocusOut>", done)

    def _rows(self, tv, keys):
        rows = []
        for i in tv.get_children():
            v = tv.item(i, "values")
            r = {}
            for k, x in zip(keys, v):
                if k in ("name", "stitch"):
                    r[k] = str(x)
                else:
                    try:
                        r[k] = float(x)
                    except ValueError:
                        r[k] = 0.0
            rows.append(r)
        return rows

    def n(self, key):
        try:
            return float(self.vars[key].get())
        except ValueError:
            return 0.0

    # ---------- حساب ----------
    def _fabric_changed(self, _=None):
        self.vars["gsm"].set(str(FABRICS[self.fabric.get()][0]))
        self.calc()

    def calc(self):
        if not hasattr(self, "st"):
            return
        pieces = self._rows(self.pt, ("name", "w", "h", "q"))
        seams = self._rows(self.st, ("name", "stitch", "len", "q"))
        tf = FABRICS[self.fabric.get()][1]
        fm, fk, tm = calculate(pieces, seams, self.n("width"), self.n("eff"), self.n("fw"),
                               self.n("tw"), self.n("qty"), self.n("gsm"), tf, self.ratios)
        q = self.n("qty")
        self.out.set(
            f"قماش للقطعة: {fm:.3f} م  ({fk:.3f} كجم)\n"
            f"خيط للقطعة: {tm:.1f} م\n"
            f"قماش للطلبية: {fm * q:,.0f} م  ({fk * q:,.1f} كجم)\n"
            f"خيط للطلبية: {tm * q / 1000:,.2f} كم  (~{tm * q / 5000:,.0f} بكرة 5000 م)")

    def edit_ratios(self):
        win = tk.Toplevel(self)
        win.title("معاملات الغرز")
        vs = {}
        for i, (k, v) in enumerate(self.ratios.items()):
            ttk.Label(win, text=f"غرزة {k}").grid(row=i, column=0, padx=6, pady=2)
            vs[k] = tk.StringVar(value=str(v))
            ttk.Entry(win, textvariable=vs[k], width=8).grid(row=i, column=1)

        def save():
            for k, v in vs.items():
                try:
                    self.ratios[k] = float(v.get())
                except ValueError:
                    pass
            win.destroy()
            self.calc()
        ttk.Button(win, text="حفظ", command=save).grid(row=len(vs), columnspan=2, pady=6)

    # ---------- الذكاء الاصطناعي ----------
    def key(self):
        if CONFIG.exists():
            return json.loads(CONFIG.read_text()).get("key", "")
        return os.environ.get("ANTHROPIC_API_KEY", "")

    def ask_key(self):
        win = tk.Toplevel(self)
        win.title("مفتاح API")
        ttk.Label(win, text="الصق مفتاح Anthropic API (من console.anthropic.com):").pack(padx=8, pady=6)
        v = tk.StringVar(value=self.key())
        ttk.Entry(win, textvariable=v, width=60, show="*").pack(padx=8)

        def save():
            CONFIG.write_text(json.dumps({"key": v.get().strip()}))
            win.destroy()
        ttk.Button(win, text="حفظ", command=save).pack(pady=8)

    def pick(self):
        fs = filedialog.askopenfilenames(filetypes=[("Spec", "*.pdf *.png *.jpg *.jpeg *.webp *.gif")])
        if fs:
            self.files = list(fs)
            self.status.config(text=f"{len(fs)} ملف")

    def run_ai(self):
        if not self.files:
            return messagebox.showinfo("تنبيه", "اختار ملف الـ spec الأول")
        if not self.key():
            self.ask_key()
            return
        self.go.config(state="disabled")
        self.status.config(text="بقرأ الـ Spec... ممكن ياخد دقيقة")
        threading.Thread(target=self._worker, daemon=True).start()

    def _worker(self):
        try:
            data = read_spec(self.key(), self.files, self.fabric.get())
            self.after(0, lambda: self._fill(data))
        except Exception as ex:
            self.after(0, lambda: self._fail(ex))

    def _fail(self, ex):
        self.go.config(state="normal")
        self.status.config(text="حصل خطأ")
        messagebox.showerror("خطأ", str(ex))

    def _fill(self, d):
        for tv in (self.pt, self.st):
            tv.delete(*tv.get_children())
        for p in d.get("pieces", []):
            self.pt.insert("", "end", values=(p.get("name", ""), p.get("w", 0), p.get("h", 0), p.get("q", 1)))
        for s in d.get("seams", []):
            self.st.insert("", "end", values=(s.get("name", ""), str(s.get("stitch", "514")),
                                              s.get("len", 0), s.get("q", 1)))
        warn = "⚠ الأبعاد تقديرية، راجعها. " if d.get("estimated") else ""
        self.notes.config(text=f"الاستايل: {d.get('style', '')}. {warn}{d.get('notes', '')}")
        self.status.config(text="تم. راجع الأرقام")
        self.go.config(state="normal")
        self.calc()

if __name__ == "__main__":
    App().mainloop()

# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
